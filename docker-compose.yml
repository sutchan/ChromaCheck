# docker-compose.yml — ChromaCheck 自托管编排（任务 O-06）
# chromacheck v1.17.3
services:
  chromacheck:
    build: .
    container_name: chromacheck
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
