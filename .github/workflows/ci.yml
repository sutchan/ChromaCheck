# CI 工作流 — ChromaCheck
# 规范依据：docs/SPEC.md §8.4 / docs/ARCHITECTURE.md §8.1 / docs/TESTING.md §7.1
# 注：当前项目已为 Next.js 14 应用（package.json + lint/type-check/test/build 脚本齐备）。
#     测试门禁：Vitest（npm test）；e2e 暂未配置。
# 安装步骤统一用 `npm install`；不配置 setup-node 的 `cache` 选项，
# 避免 v5 依据 packageManager / lock 文件自动启用缓存而改变构建可复现性。
# checkout / setup-node 使用 v5（动作运行时 Node 24），项目运行时用 Node 22 LTS。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests
        run: echo "E2E 跳过：当前版本未配置 e2e"
