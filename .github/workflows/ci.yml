# CI 工作流 — ChromaCheck
# 规范依据：docs/SPEC.md §8.4 / docs/ARCHITECTURE.md §8.1 / docs/TESTING.md §7.1
# 注：当前项目已为 Next.js 14 应用（package.json + lint/type-check/test/build 脚本齐备）。
#     测试门禁：Vitest（npm test）；e2e 暂未配置。
# 仓库不提交 lock 文件（package-lock.json / yarn.lock），故不使用 setup-node 的
# npm 缓存，安装步骤用 `npm install`（`npm ci` 与 `cache: npm` 均要求 lock 文件存在）。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests
        run: echo "E2E 跳过：当前版本未配置 e2e"
