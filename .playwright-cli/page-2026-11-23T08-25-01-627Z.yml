      - region [ref=f1e98]:
        - heading "关于本站的关键事实" [level=2] [ref=f1e99]
        - list [ref=f1e100]:
          - listitem [ref=f1e101]: 题库实况：石原氏标准版为 38 张消失型数字图（另含演示题），快速版取其 10 题；未实现真正的变形、隐藏双数字或分类题型。
          - listitem [ref=f1e102]: 判读边界：本工具仅提示色觉异常倾向与程度，不能可靠区分红色觉 / 绿色觉 / 蓝黄色觉异常类型，也不能区分「色盲」与「色弱」；异常类型字段在无转换/分类题命中时输出未分型（null）。
          - listitem [ref=f1e103]: 色盲是某类视锥细胞缺失，色弱是该类细胞功能减弱；先天性红绿色觉异常多为 X 染色体连锁隐性遗传，男性更常见。
          - listitem [ref=f1e104]: 隐私：答题记录与判读结果默认仅存于用户本机浏览器（localStorage），不上传服务器，可随时查看、导出或删除，最多保留最近 30 次；仅以 GA4 匿名统计页面浏览。
          - listitem [ref=f1e105]: 医学免责声明：在线筛查结果仅供初筛参考，不能替代专业眼科诊断；入学、入职与驾照等正式体检须由指定机构完成。
          - listitem [ref=f1e106]: 界面语言：默认简体中文，其次繁体中文（台湾用语），再次英语；SSR metadata 与结构化数据恒以简体中文输出（SPEC §8.5）。
